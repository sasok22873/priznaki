services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pb
      POSTGRES_PASSWORD: pb
      POSTGRES_DB: pb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://pb:pb@db:5432/pb
      SUPABASE_URL: ${SUPABASE_URL:-https://mbbetmtxawduvcsttiis.supabase.co}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
